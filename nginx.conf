server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets (JS/CSS bundles have hashed filenames, so long TTL is safe)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # This is the critical rule for React Router / SPA routing.
    # Without it, refreshing a non-root route (e.g. /about) returns a 404
    # because Nginx looks for a real file at that path.
    # This tells Nginx: if the file doesn't exist, fall back to index.html
    # and let React handle routing in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
