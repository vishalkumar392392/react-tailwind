# ─── Project identity ─────────────────────────────────────────────────────────
# projectKey must be unique across the SonarQube server.
sonar.projectKey=tailwind-shoes
sonar.projectName=Tailwind Shoes (React Frontend)
sonar.projectVersion=1.0

# ─── Source layout ────────────────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ─── Language hint ────────────────────────────────────────────────────────────
# Helps the scanner pick the right analyzers without auto-detection overhead.
sonar.language=js

# ─── Exclusions ───────────────────────────────────────────────────────────────
# Skip generated, vendored, and config-only files from analysis.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/vite.config.js,\
  **/eslint.config.js,\
  public/**

# ─── Coverage (wire up later when you add tests) ──────────────────────────────
# When you add Vitest/Jest, point this at the LCOV report it generates.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  **/*.test.{js,jsx},\
  **/*.spec.{js,jsx},\
  **/__tests__/**,\
  **/__mocks__/**,\
  src/main.jsx,\
  src/**/index.{js,jsx}
